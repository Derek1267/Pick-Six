<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pick Six</title>
  <meta name="description" content="Make a private league, pick winners from real NFL, NBA, NHL, MLB, MLS and NLL schedules, and climb the leaderboard.">
  <meta name="theme-color" content="#1e1036">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved light/dark choice before the page paints (no flash). No choice = follow the device.
    try { const t = localStorage.getItem('pickSix.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Pick Six home">
      <img class="brand-mark" src="logo.svg" alt="" width="36" height="36">
      <span class="brand-name">Pick&nbsp;Six</span>
    </a>
    <div class="topbar-right">
      <button class="theme-toggle" id="help-btn" type="button" aria-label="What is Pick Six?" title="What is Pick Six?"></button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Light / dark mode"></button>
      <nav id="account" class="account"></nav>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loading">Loading…</div>
  </main>

  <footer class="site-footer"><a href="#/how">How it works</a></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="manage-dialog" class="dialog" aria-label="Manage league"></dialog>
  <dialog id="pick-dialog" class="dialog pick" aria-label="Make a pick"></dialog>
  <dialog id="intro-dialog" class="dialog intro" aria-labelledby="intro-title"></dialog>

  <dialog id="name-dialog" class="dialog">
    <form method="dialog" id="name-form">
      <h2>Your display name</h2>
      <p class="muted">This is what your league-mates see on the leaderboard.</p>
      <input id="name-input" name="name" maxlength="30" required autocomplete="nickname">
      <div class="row end">
        <button type="button" class="btn ghost" id="name-cancel">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
