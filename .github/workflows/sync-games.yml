name: Sync NFL games

on:
  schedule:
    # Every 15 minutes. GitHub may run scheduled jobs a few minutes late; that's fine —
    # picks lock on the database clock at kickoff, not when this runs.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full_season:
        description: 'Load the whole season (use once at setup)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync games from ESPN into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-games.mjs ${{ inputs.full_season && '--all' || '' }}
