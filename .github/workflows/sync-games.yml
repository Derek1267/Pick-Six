name: Sync games

on:
  schedule:
    # Every 15 minutes: live scores, finals, and the next few days/weeks of games.
    # GitHub may run scheduled jobs a few minutes late; that's fine —
    # picks lock on the database clock at kickoff, not when this runs.
    - cron: '*/15 * * * *'
    # Once a day: reload whole seasons (schedule changes, new seasons, playoff games).
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      full_season:
        description: 'Load whole seasons (use at setup)'
        type: boolean
        default: false
      sport:
        description: 'Which sport'
        type: choice
        default: all
        options: [all, nfl, nba, nhl, mlb, mls, nll]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync games from ESPN into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL: ${{ inputs.full_season || github.event.schedule == '17 10 * * *' }}
          SPORT: ${{ inputs.sport || 'all' }}
        run: node scripts/sync-games.mjs --sport "$SPORT" $( [ "$FULL" = "true" ] && echo --all )
